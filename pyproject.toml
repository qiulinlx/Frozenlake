[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frozenlake"
version = "0.1.0"
description = "OpenAI Gym's Frozen Lake as a JAX / Jumanji environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tyro",
    "jax",
    "jaxtyping",
    "chex",
    "jumanji>=1.0",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/riberaborrell/Frozenlake"

[tool.setuptools.packages.find]
include = ["frozenlake*"]

[tool.setuptools.package-data]
img = ["img/*.png"]
